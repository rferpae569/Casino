<!--Contenedor-->
<div class="borrar-container">
  <form (ngSubmit)="enviarFormulario()" [formGroup]="borrarForm">
    <h2 style="text-align: center">
      Lamentamos que se vaya, le echaremos de menos.
    </h2>
    <h3 style="text-align: center">
      Introduzca sus datos para poder eliminar su cuenta.
    </h3>
    <div class="form-group">
      <label for="email"
        >Correo Electrónico: <span class="obligatorio">*</span></label
      >
      <input
        id="email"
        formControlName="correo"
        type="email"
        class="form-control"
        placeholder="Introduzca su correo electrónico"
        required
      />
    </div>
    <div class="form-group">
      <label for="name"
        >Nombre de usuario: <span class="obligatorio">*</span></label
      >
      <input
        id="usuario"
        type="text"
        formControlName="usuario"
        class="form-control"
        placeholder="Introduzca su nombre de usuario"
        readonly
      />
    </div>
    <div class="form-group">
      <label for="password"
        >Contraseña: <span class="obligatorio">*</span></label
      >
      <input
        id="password"
        formControlName="password"
        type="password"
        class="form-control"
        placeholder="Introduzca su contraseña"
        required
      />
    </div>
    <!-- Fecha de Nacimiento -->
    <div class="form-group">
      <label for="birthdate"
        >Fecha de Nacimiento: <span class="obligatorio">*</span></label
      >
      <input
        id="birthdate"
        formControlName="fechaNacimiento"
        type="date"
        class="form-control"
        required
      />
    </div>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="borrarForm.invalid"
    >
      Borrar
    </button>
  </form>
</div>
<!--Fin Contenedor-->
