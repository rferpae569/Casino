<!--Contenedor-->
<div class="actualizar-container">
  <form [formGroup]="actualizarForm" (ngSubmit)="actualizarUsuario()">
    <h3 style="text-align: center">Actualice los datos correspondientes.</h3>

    <div class="form-group">
      <label for="name">Nombre de usuario:</label>
      <input
        id="name"
        type="text"
        formControlName="Usuario"
        class="form-control"
        placeholder="Introduzca su nombre de usuario"
        [value]="usuario"
        readonly
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input
        id="password"
        type="password"
        class="form-control"
        formControlName="Passwrd"
        placeholder="Actualice su contraseña"
        required
      />
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico:</label>
      <input
        id="email"
        type="email"
        class="form-control"
        formControlName="Correo"
        placeholder="Actualice su correo electrónico"
        required
      />
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="actualizarForm.invalid"
    >
      Actualizar
    </button>
  </form>
</div>
<!--Fin Contenedor-->
